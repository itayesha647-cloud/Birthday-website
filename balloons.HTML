<!DOCTYPE html><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Surprise</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background:
        radial-gradient(circle at center, #5a111d 0%, #320812 45%, #170307 100%);
    color: white;
    font-family: Georgia, serif;
    height: 100vh;
}

/* Heading */
.title {
    position: fixed;
    top: 45px;
    width: 100%;
    text-align: center;
    z-index: 10;
}

.small-title {
    font-size: 13px;
    letter-spacing: 5px;
    text-transform: uppercase;
    opacity: 0.75;
}

h1 {
    margin: 12px 0 0;
    font-size: 42px;
    font-weight: normal;
    letter-spacing: 2px;
}

.subtitle {
    margin-top: 10px;
    font-size: 16px;
    opacity: 0.75;
    font-style: italic;
}


/* Balloons */
.balloon-box {
    position: absolute;
    width: 75px;
    height: 155px;
    cursor: pointer;
    z-index: 5;
    user-select: none;
    transition: transform 0.15s ease;
}

.balloon-box:hover {
    transform: scale(1.08);
}

.balloon {
    position: absolute;
    width: 68px;
    height: 82px;
    left: 3px;
    top: 0;

    border-radius: 50% 50% 45% 45%;

    background:
        radial-gradient(
            circle at 28% 22%,
            rgba(255,255,255,0.9) 0%,
            rgba(255,255,255,0.35) 7%,
            transparent 18%
        ),
        radial-gradient(
            circle at 65% 70%,
            rgba(80,0,10,0.35),
            transparent 55%
        ),
        linear-gradient(
            135deg,
            #ff7185,
            #b91435 55%,
            #650818
        );

    box-shadow:
        inset -10px -12px 18px rgba(0,0,0,0.35),
        inset 8px 8px 12px rgba(255,255,255,0.18),
        0 8px 18px rgba(0,0,0,0.35);

    transform-origin: bottom center;
}

/* Knot */
.balloon::after {
    content: "";
    position: absolute;
    bottom: -7px;
    left: 29px;

    width: 10px;
    height: 10px;

    background: #7d0b20;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
}

/* String */
.string {
    position: absolute;
    top: 80px;
    left: 36px;
    width: 1px;
    height: 75px;

    background: rgba(255,255,255,0.5);
}


/* Pop */
.pop {
    animation: pop 0.25s ease forwards;
}

@keyframes pop {
    0% {
        transform: scale(1);
        opacity: 1;
    }

    50% {
        transform: scale(1.35);
        opacity: 0.8;
    }

    100% {
        transform: scale(0);
        opacity: 0;
    }
}


/* Pop particles */
.particle {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ffd6dc;
    pointer-events: none;
    z-index: 20;

    animation: particle 0.6s ease-out forwards;
}

@keyframes particle {
    from {
        opacity: 1;
        transform: translate(0,0) scale(1);
    }

    to {
        opacity: 0;
        transform:
            translate(var(--x), var(--y))
            scale(0);
    }
}


/* Final Message */
.final-message {
    position: fixed;
    inset: 0;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    opacity: 0;
    visibility: hidden;

    transition: opacity 1s ease;

    z-index: 50;
}

.final-message.show {
    opacity: 1;
    visibility: visible;
}

.love-text {
    font-size: 75px;
    font-family: "Brush Script MT", cursive;
    font-style: italic;
    text-shadow:
        0 0 15px rgba(255,180,190,0.5),
        0 0 35px rgba(255,80,100,0.25);

    animation: loveAppear 1.2s ease;
}

@keyframes loveAppear {
    from {
        transform: scale(0.5);
        opacity: 0;
    }

    to {
        transform: scale(1);
        opacity: 1;
    }
}


/* Next Button */
.next-button {
    margin-top: 35px;

    padding: 12px 34px;

    border: 1px solid rgba(255,255,255,0.45);
    border-radius: 30px;

    background: rgba(255,255,255,0.08);
    color: white;

    font-size: 15px;
    letter-spacing: 3px;

    cursor: pointer;

    transition: all 0.3s ease;
}

.next-button:hover {
    background: rgba(255,255,255,0.18);
    transform: translateY(-3px);
}
</style>
</head>


<body>


<!-- Heading -->
<div class="title">

    <div class="small-title">
        A Little Surprise
    </div>

    <h1>
        Catch the Balloons
    </h1>

    <div class="subtitle">
        Pop them one by one ♡
    </div>

</div>


<!-- BALLOONS -->

<div class="balloon-box">
    <div class="balloon"></div>
    <div class="string"></div>
</div>

<div class="balloon-box">
    <div class="balloon"></div>
    <div class="string"></div>
</div>

<div class="balloon-box">
    <div class="balloon"></div>
    <div class="string"></div>
</div>

<div class="balloon-box">
    <div class="balloon"></div>
    <div class="string"></div>
</div>

<div class="balloon-box">
    <div class="balloon"></div>
    <div class="string"></div>
</div>

<div class="balloon-box">
    <div class="balloon"></div>
    <div class="string"></div>
</div>

<div class="balloon-box">
    <div class="balloon"></div>
    <div class="string"></div>
</div>

<div class="balloon-box">
    <div class="balloon"></div>
    <div class="string"></div>
</div>

<div class="balloon-box">
    <div class="balloon"></div>
    <div class="string"></div>
</div>

<div class="balloon-box">
    <div class="balloon"></div>
    <div class="string"></div>
</div>


<!-- FINAL MESSAGE -->

<div class="final-message" id="finalMessage">

    <div class="love-text">
        I Love You ❤️
    </div>

    <button class="next-button" onclick="goNext()">
        NEXT →
    </button>

</div>


<script>

const balloons = document.querySelectorAll(".balloon-box");

let items = [];

let poppedCount = 0;


/* Balloon colors */

const colors = [
    ["#ff7185", "#b91435", "#650818"],
    ["#e85d9e", "#9d1458", "#50052c"],
    ["#d88cff", "#7d2fa3", "#3b0d54"],
    ["#ff9d6c", "#c63f20", "#641508"],
    ["#ff6b9a", "#b51c52", "#620925"]
];


/* Starting positions */

balloons.forEach((box, index) => {

    const x =
        Math.random() *
        (window.innerWidth - 100);

    const y =
        150 +
        Math.random() *
        (window.innerHeight - 300);


    const speedX =
        (Math.random() * 1.2 + 0.5) *
        (Math.random() > 0.5 ? 1 : -1);


    const speedY =
        (Math.random() * 1.0 + 0.4) *
        (Math.random() > 0.5 ? 1 : -1);


    const color =
        colors[index % colors.length];


    const balloon =
        box.querySelector(".balloon");


    balloon.style.background = `

        radial-gradient(
            circle at 28% 22%,
            rgba(255,255,255,0.9) 0%,
            rgba(255,255,255,0.35) 7%,
            transparent 18%
        ),

        radial-gradient(
            circle at 65% 70%,
            rgba(0,0,0,0.35),
            transparent 55%
        ),

        linear-gradient(
            135deg,
            ${color[0]},
            ${color[1]} 55%,
            ${color[2]}
        )

    `;


    items.push({

        element: box,

        x: x,
        y: y,

        dx: speedX,
        dy: speedY,

        popped: false

    });


    box.style.left =
        x + "px";

    box.style.top =
        y + "px";

});


/* Move balloons */

function moveBalloons() {

    items.forEach(item => {

        if (item.popped)
            return;


        item.x += item.dx;

        item.y += item.dy;


        const maxX =
            window.innerWidth - 90;

        const maxY =
            window.innerHeight - 170;


        if (
            item.x <= 0 ||
            item.x >= maxX
        ) {
            item.dx *= -1;
        }


        if (
            item.y <= 130 ||
            item.y >= maxY
        ) {
            item.dy *= -1;
        }


        item.element.style.left =
            item.x + "px";

        item.element.style.top =
            item.y + "px";

    });


    requestAnimationFrame(moveBalloons);

}

moveBalloons();


/* POP BALLOON */

balloons.forEach((box, index) => {

    box.addEventListener("click", function() {

        const item =
            items[index];


        if (item.popped)
            return;


        item.popped = true;

        poppedCount++;


        const rect =
            box.getBoundingClientRect();


        /* Balloon pop */

        box.querySelector(".balloon")
            .classList.add("pop");


        box.querySelector(".string")
            .classList.add("pop");


        /* Particles */

        for (
            let i = 0;
            i < 12;
            i++
        ) {

            const particle =
                document.createElement("div");


            particle.className =
                "particle";


            particle.style.left =
                (
                    rect.left +
                    rect.width / 2
                ) + "px";


            particle.style.top =
                (
                    rect.top + 40
                ) + "px";


            particle.style.setProperty(
                "--x",
                (
                    Math.random() * 100 - 50
                ) + "px"
            );


            particle.style.setProperty(
                "--y",
                (
                    Math.random() * 100 - 50
                ) + "px"
            );


            document.body.appendChild(
                particle
            );


            setTimeout(() => {

                particle.remove();

            }, 700);

        }


        /* Hide balloon */

        setTimeout(() => {

            box.style.display =
                "none";

        }, 250);


        /* Check all balloons */

        if (
            poppedCount ===
            balloons.length
        ) {

            setTimeout(() => {

                document
                    .getElementById(
                        "finalMessage"
                    )
                    .classList.add("show");

            }, 500);

        }

    });

});


/* NEXT PAGE */

function goNext() {

    window.location.href =
        "pic.html";

}

</script>

</body>
</html>
